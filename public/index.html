<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokedex</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function searchPokemon() {
            const searchString = document.getElementById("searchInput").value;
            const response = await fetch("https://us-central1-pokedex-search-engine.cloudfunctions.net/api/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ search_string: searchString }),
            });

            const data = await response.json();
            document.getElementById("result").innerText = `Similar Query: ${data.related_query}`;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Pokedex</h1>
        <input id="searchInput" type="text" placeholder="Search..." class="form-control">
        <button onclick="searchPokemon()" class="btn btn-primary">Search</button>
        <p id="result"></p>
    </div>
</body>
</html>
